[treasure_growth]
	#是否启用财宝堆成长加速
	enabled = true
	#财宝方块权重，格式: modid:block_id=weight
	#未列出的方块默认权重 1.0
	#内置默认: debris=5, diamond=4, emerald=3, gold=2, iron=1, copper=0.5
	treasureWeights = ["dragonsurvival:copper_dragon_treasure=0.5", "dragonsurvival:iron_dragon_treasure=1.0", "dragonsurvival:gold_dragon_treasure=2.0", "dragonsurvival:emerald_dragon_treasure=3.0", "dragonsurvival:diamond_dragon_treasure=4.0", "dragonsurvival:debris_dragon_treasure=5.0", "iceandfire:gold_pile=0.4", "iceandfire:silver_pile=0.3", "iceandfire:copper_pile=0.1"]
	#最大财宝价值上限，超出部分不再计入
	# Default: 9800
	# Range: > 1
	maxTreasureValue = 9800
	#每多少财宝价值提升 1 级效果等级
	# Default: 100
	# Range: 1 ~ 10000
	amplifierStep = 100
	#最大效果等级（0-255）
	# Default: 255
	# Range: 0 ~ 255
	maxAmplifier = 255
	#效果持续时间（ticks），需大于检查间隔确保不闪烁
	# Default: 40
	# Range: 20 ~ 6000
	effectDurationTicks = 40
	#财宝价值检查间隔（ticks），默认 20 = 每秒一次
	# Default: 20
	# Range: 1 ~ 1200
	checkIntervalTicks = 20

[dimension_transport]
	#玩家 Y 坐标检查间隔（ticks），默认 20 = 每秒一次
	# Default: 20
	# Range: 1 ~ 1200
	checkIntervalTicks = 20
	#传送后冷却时间（ticks），防止循环传送
	# Default: 100
	# Range: 0 ~ 72000
	cooldownTicks = 100

	[dimension_transport.overworldToLoongPalace]
		#是否启用 主世界 → 龙宫 的传送
		enabled = true
		#触发传送的 Y 轴高度（玩家 Y > 此值时传送）
		# Default: 8848
		# Range: -4064 ~ 100000
		triggerY = 8848
		#目标维度 ID
		targetDimension = "beloong:loong_palace"
		#目标固定 X 坐标
		# Default: 0.5
		# Range: -3.0E7 ~ 3.0E7
		targetX = 0.5
		#目标固定 Z 坐标
		# Default: 0.5
		# Range: -3.0E7 ~ 3.0E7
		targetZ = 0.5
		#高度图查找失败时的回退 Y 坐标
		# Default: 64.5
		# Range: -2032.0 ~ 2032.0
		fallbackY = 64.5

	[dimension_transport.loongPalaceToOverworld]
		#是否启用 龙宫 → 主世界 的传送
		enabled = true
		#触发传送的 Y 轴高度（玩家 Y < 此值时传送）
		# Default: 0
		# Range: -2032 ~ 2032
		triggerY = 0
		#目标维度 ID
		targetDimension = "minecraft:overworld"
		#目标固定 X 坐标
		# Default: 0.5
		# Range: -3.0E7 ~ 3.0E7
		targetX = 0.5
		#目标固定 Z 坐标
		# Default: 0.5
		# Range: -3.0E7 ~ 3.0E7
		targetZ = 0.5
		#高度图查找失败时的回退 Y 坐标
		# Default: 64.5
		# Range: -2032.0 ~ 2032.0
		fallbackY = 64.5

[disaster_portal]
	#激活传送门所需的 12 种眼球物品 ID（顺序可任意）
	eyeItems = ["minecraft:ender_eye", "cataclysm:mech_eye", "cataclysm:flame_eye", "cataclysm:void_eye", "cataclysm:monstrous_eye", "cataclysm:abyss_eye", "cataclysm:desert_eye", "cataclysm:cursed_eye", "cataclysm:storm_eye", "fdbosses:eye_of_chesed", "fdbosses:eye_of_malkuth", "fdbosses:eye_of_geburah"]
	#返回传送门结构模板 ID
	returnStructureTemplate = "beloong:disaster/return_portal"
	#传送冷却时间（ticks），防止循环传送
	# Default: 100
	# Range: 0 ~ 72000
	teleportCooldownTicks = 100
	#返回结构相对于玩家传送坐标的 X 偏移
	#结构默认为 5×5 底部平台，-2 = 玩家位于平台中央
	structureOffsetX = -2
	#返回结构相对于地表高度的 Y 偏移
	#默认 0 使平台底部贴着地面，玩家站在平台上
	structureOffsetY = 0
	#返回结构相对于玩家传送坐标的 Z 偏移
	#结构默认为 5×5 底部平台，-2 = 玩家位于平台中央
	structureOffsetZ = -2

[structure_effects]
	#需要监听过期/移除事件的药水效果ID列表
	#当这些效果过期、被牛奶清除或被指令移除时，触发结构重检
	watchedEffects = ["beloong:flight_ban"]
	#结构效果配置，格式: "结构ID|效果ID|等级|持续时间(tick)"
	#等级: 0 = I级, 1 = II级, 以此类推
	#示例: "cataclysm:burning_arena|beloong:flight_ban|5|100"
	entries = ["cataclysm:burning_arena|beloong:flight_ban|5|100"]
