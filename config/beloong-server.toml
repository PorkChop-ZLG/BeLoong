[treasure_growth]
	#是否启用财宝堆成长加速
	enabled = true
	#最大财宝价值上限，超出部分不再计入
	# Default: 9800
	# Range: > 1
	maxTreasureValue = 25500
	#每多少财宝价值提升 1 级效果等级
	# Default: 100
	# Range: 1 ~ 10000
	amplifierStep = 100
	#最大效果等级（0-255）
	# Default: 255
	# Range: 0 ~ 255
	maxAmplifier = 255
	#效果持续时间（ticks），需大于检查间隔确保不闪烁
	# Default: 40
	# Range: 20 ~ 6000
	effectDurationTicks = 40
	#财宝价值检查间隔（ticks），默认 20 = 每秒一次
	# Default: 20
	# Range: 1 ~ 1200
	checkIntervalTicks = 20

[dimension_transport]
	#玩家 Y 坐标检查间隔（ticks），默认 20 = 每秒一次
	# Default: 20
	# Range: 1 ~ 1200
	checkIntervalTicks = 20
	#传送后冷却时间（ticks），防止循环传送
	# Default: 100
	# Range: 0 ~ 72000
	cooldownTicks = 100

	[dimension_transport.overworldToLoongPalace]
		#是否启用 主世界 → 龙宫 的传送
		enabled = true
		#触发传送的 Y 轴高度（玩家 Y > 此值时传送）
		# Default: 8848
		# Range: -4064 ~ 100000
		triggerY = 10000
		#目标维度 ID
		targetDimension = "beloong:loong_palace"
		#目标固定 X 坐标
		# Default: 0.5
		# Range: -3.0E7 ~ 3.0E7
		targetX = 0.5
		#目标固定 Z 坐标
		# Default: 0.5
		# Range: -3.0E7 ~ 3.0E7
		targetZ = 0.5
		#高度图查找失败时的回退 Y 坐标
		# Default: 64.5
		# Range: -2032.0 ~ 2032.0
		fallbackY = 64.5

	[dimension_transport.loongPalaceToOverworld]
		#是否启用 龙宫 → 主世界 的传送
		enabled = true
		#触发传送的 Y 轴高度（玩家 Y < 此值时传送）
		# Default: 0
		# Range: -2032 ~ 2032
		triggerY = 0
		#目标维度 ID
		targetDimension = "minecraft:overworld"
		#目标固定 X 坐标
		# Default: 0.5
		# Range: -3.0E7 ~ 3.0E7
		targetX = 0.5
		#目标固定 Z 坐标
		# Default: 0.5
		# Range: -3.0E7 ~ 3.0E7
		targetZ = 0.5
		#高度图查找失败时的回退 Y 坐标
		# Default: 64.5
		# Range: -2032.0 ~ 2032.0
		fallbackY = 64.5

[disaster_portal]
	#激活传送门所需的 12 种眼球物品 ID（顺序可任意）
	eyeItems = ["minecraft:ender_eye", "cataclysm:mech_eye", "cataclysm:flame_eye", "cataclysm:void_eye", "cataclysm:monstrous_eye", "cataclysm:abyss_eye", "cataclysm:desert_eye", "cataclysm:cursed_eye", "cataclysm:storm_eye", "fdbosses:eye_of_chesed", "fdbosses:eye_of_malkuth", "fdbosses:eye_of_geburah"]
	#传送冷却时间（ticks），防止循环传送
	# Default: 100
	# Range: 0 ~ 72000
	teleportCooldownTicks = 100

[structure_effects]
	#需要监听过期/移除事件的药水效果ID列表
	#当这些效果过期、被牛奶清除或被指令移除时，触发结构重检
	#具体效果与结构的映射请在 data/beloong/beloong/structure_effects/ 中配置
	watchedEffects = ["beloong:flight_ban"]

[beloong_water]
	#化龙池水冷却（ticks）
	# Default: 200
	# Range: 0 ~ 72000
	beloongWaterCooldown = 200
