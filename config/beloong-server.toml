[treasure_growth]
	#是否启用财宝堆成长加速
	enabled = true
	#最大财宝价值上限，超出部分不再计入
	# Default: 9800
	# Range: > 1
	maxTreasureValue = 25500
	#每多少财宝价值提升 1 级效果等级
	# Default: 100
	# Range: 1 ~ 10000
	amplifierStep = 100
	#最大效果等级（0-255）
	# Default: 255
	# Range: 0 ~ 255
	maxAmplifier = 255
	#效果持续时间（ticks），需大于检查间隔确保不闪烁
	# Default: 40
	# Range: 20 ~ 6000
	effectDurationTicks = 40
	#财宝价值检查间隔（ticks），默认 20 = 每秒一次
	# Default: 20
	# Range: 1 ~ 1200
	checkIntervalTicks = 20

[dimension_transport]
	#玩家 Y 坐标检查间隔（ticks），默认 20 = 每秒一次
	# Default: 20
	# Range: 1 ~ 1200
	checkIntervalTicks = 20
	#传送后冷却时间（ticks），防止循环传送
	# Default: 100
	# Range: 0 ~ 72000
	cooldownTicks = 100

	[dimension_transport.overworldToLoongPalace]
		#是否启用 主世界 → 龙宫 的传送
		enabled = true
		#触发传送的 Y 轴高度（玩家 Y > 此值时传送）
		# Default: 8848
		# Range: -4064 ~ 100000
		triggerY = 10000
		#目标维度 ID
		targetDimension = "beloong:loong_palace"
		#目标固定 X 坐标
		# Default: 0.5
		# Range: -3.0E7 ~ 3.0E7
		targetX = 0.5
		#目标固定 Z 坐标
		# Default: 0.5
		# Range: -3.0E7 ~ 3.0E7
		targetZ = 0.5
		#高度图查找失败时的回退 Y 坐标
		# Default: 64.5
		# Range: -2032.0 ~ 2032.0
		fallbackY = 64.5

	[dimension_transport.loongPalaceToOverworld]
		#是否启用 龙宫 → 主世界 的传送
		enabled = true
		#触发传送的 Y 轴高度（玩家 Y < 此值时传送）
		# Default: 0
		# Range: -2032 ~ 2032
		triggerY = 0

[disaster_portal]
	#激活传送门所需的 12 种眼球物品 ID（顺序可任意）
	eyeItems = ["minecraft:ender_eye", "cataclysm:mech_eye", "cataclysm:flame_eye", "cataclysm:void_eye", "cataclysm:monstrous_eye", "cataclysm:abyss_eye", "cataclysm:desert_eye", "cataclysm:cursed_eye", "cataclysm:storm_eye", "fdbosses:eye_of_chesed", "fdbosses:eye_of_malkuth", "fdbosses:eye_of_geburah"]
	#传送冷却时间（ticks），防止循环传送
	# Default: 100
	# Range: 0 ~ 72000
	teleportCooldownTicks = 100

[structure_effects]
	#需要监听过期/移除事件的药水效果ID列表
	#当这些效果过期、被牛奶清除或被指令移除时，触发结构重检
	#具体效果与结构的映射请在 data/beloong/beloong/structure_effects/ 中配置
	watchedEffects = ["beloong:flight_ban"]

[beloong_water]
	#化龙池水冷却（ticks）
	# Default: 200
	# Range: 0 ~ 72000
	beloongWaterCooldown = 200

	[loong_palace.environment_protection]
		#Master switch for configurable Loong Palace environment protection
		#龙宫可配置环境保护的总开关
		enabled = true
		#Prevent explosions reaching NeoForge's detonate event from changing blocks
		#Dragon Survival's protected explosion skill remains fully canceled
		#阻止进入 NeoForge 爆炸事件的爆炸修改方块
		#龙之生存受保护的爆炸技能仍会被完整取消
		protectExplosions = true
		#Prevent block placement attributed to non-player entities or no actor
		#阻止由非玩家实体或无来源行为放置方块
		protectNonPlayerBlockPlacement = true
		#Prevent living entities from destroying blocks
		#阻止生物破坏方块
		protectLivingBlockDestruction = true
		#Disable mob-griefing actions
		#阻止生物破坏环境的行为
		protectMobGriefing = true
		#Prevent farmland trampling
		#阻止耕地被踩踏
		protectFarmlandTrampling = true
		#Prevent tool actions such as stripping, tilling, and flattening
		#阻止去皮、耕作和铲平等工具修改方块的行为
		protectToolModifications = true
		#Prevent random-tick crop growth and non-bypass bone meal use
		#阻止随机刻作物生长和无绕过权限玩家使用骨粉
		protectCropGrowth = true
		#Prevent saplings and similar blocks from growing configured features
		#阻止树苗等方块生长为地物
		protectFeatureGrowth = true
		#Prevent block updates from creating portals
		#阻止方块更新创建传送门
		protectPortalCreation = true
		#Prevent players from placing or collecting fluids with buckets and solid buckets
		#阻止玩家使用桶和固体桶放置或收集流体
		protectFluidContainerEdits = true
		#Prevent players from placing, changing, or destroying paintings and item frames
		#阻止玩家放置、修改或破坏画与物品展示框
		protectHangingEntityEdits = true
		#Prevent players from inserting or removing flower-pot contents
		#阻止玩家放入或取出花盆内容物
		protectFlowerPotEdits = true

[dragon_summon]
	#Enable the Ender Dragon summon ritual
	#启用手动召唤末影龙仪式
	enabled = true
	#Block used to summon the Ender Dragon
	#用于召唤末影龙的特殊方块 ID
	summonBlock = "bosses_of_mass_destruction:levitation_block"
