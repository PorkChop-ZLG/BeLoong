[world_creation_settings]
	#Please fill in strictly according to the correct method
	#请严格按照正确的方式填写
	#The directory of the world template,At the same level as the mods folder.What is placed inside are numerous files from within the file, rather than a single file folder
	#模板世界所在的目录,和mods文件夹同级.里面放入的是存档内部的许多文件而不是单个存档文件夹.
	template_directory = "template"
	#Whether a template should be used instead of creating regular worlds.After activation, the files from the template world will be completely copied into the newly created world
	#是否使用模板世界替代正常创建世界,开启后会将模板世界的文件完全的复制到新创建的世界中.
	use_template = false
	#Whether configured dimensions should be copied from the template world into newly created worlds.If you have turned on this switch, please turn off the one above that copies the entire file.
	#是否将配置的维度从模板世界复制到新创建的世界中.如果开启此项,请关闭上面那个复制整个模板世界的开关.
	pin_dimensions_enabled = true
	#Dimension ids copied from the template world, for example ["lockdown:test_dimension", "minecraft:the_nether"]. minecraft:overworld is supported in a limited way and only copies the root data,entities,poi,region directories.
	#要从模板世界复制的维度 ID,例如 ["lockdown:test_dimension", "minecraft:the_nether"]；其中 minecraft:overworld 仅有限支持,只会复制根目录下的 data,entities,poi,region.
	pinned_dimensions = ["beloong:loong_palace"]
	#Whether newly generated chunks in the configured dimensions should use the seed stored in template/level.dat instead of the current world's own seed.
	#配置的维度中新生成的区块是否使用 template/level.dat 中保存的种子,而不是当前世界自己的种子.
	template_seed_dimensions_enabled = false
	#Dimension ids whose new chunk generation should use the template world's level.dat seed, for example ["minecraft:the_nether", "lockdown:test_dimension"].
	#新生成区块时要使用模板世界 level.dat 种子的维度 ID,例如 ["minecraft:the_nether", "lockdown:test_dimension"].
	template_seed_dimensions = []
	#Whether the configured dimension and coordinates should be used as the initial spawn point for new players and as the respawn fallback when they have no personal respawn point.
	#是否将配置的维度和坐标作为新玩家的初始出生点,以及在玩家没有个人重生点时的默认复活点.
	login_spawn_teleport_enabled = true
	#Configured spawn target in the format dimension_id;x;y;z;yaw;pitch, for example minecraft:overworld;0.5;64.0;0.5;0.0;0.0.
	#配置出生点的格式为 dimension_id;x;y;z;yaw;pitch,例如 minecraft:overworld;0.5;64.0;0.5;0.0;0.0.
	login_spawn_target = "beloong:loong_palace;0.5;64.0;0.5;180.0;0.0"

[world_creation_menu_settings]
	#Whether to display world settings
	#是否显示世界设置.
	enable_world_tab = true
	#Whether to display more world options
	#是否显示更多世界选项.
	enable_more_tab = true

[main_menu_settings]
	#Whether to display the multiplayer button.
	#是否显示多人游戏按钮.
	disable_multiplayer = true
	#Whether to display the single-player button.
	#是否显示单人游戏按钮.
	disable_singleplayer = true
