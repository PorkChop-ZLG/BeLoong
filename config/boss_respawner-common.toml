[general]
	#Master switch for the whole mod. Set false to stop new placement/spawning logic.
	#Already lit cages and queued placement tasks pause and resume when re-enabled.
	enableMod = true
	#Render a vanilla-style glowing outline around Boss Respawner blocks so players can see them through walls.
	#This is a client-side rendering effect, but it is configured here in the common config.
	#When false, no outline is requested and no outline rendering work is performed.
	highlightBossRespawner = true
	#Maximum distance in blocks at which Boss Respawner blocks are outlined.
	#Default: 32
	# Default: 32
	# Range: 1 ~ 256
	highlightBossRespawnerRange = 48

[debug]
	#Debug logging. When true, prints debug information about Boss respawner placement and spawning to the log.
	#This setting lives in its own [debug] group.
	debugInfo = false
