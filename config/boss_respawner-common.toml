[general]
	#Master switch for the whole mod. Set false to disable all placement/spawning logic.
	enableMod = true
	#When no safe placement position is found after a Boss death, force place the respawner at the search origin.
	#This ignores placement safety rules such as require_ground/avoid_fluids/avoid_blocks, but still respects duplicate mode and the global foreignCageBlockIds compatibility list.
	#Default: true
	forcePlaceOnNoSafeSpot = true
	#Render a vanilla-style glowing outline around Boss Respawner blocks so players can see them through walls.
	#This is a client-side rendering effect, but it is configured here in the common config.
	#When false, no outline is requested and no outline rendering work is performed.
	highlightBossRespawner = true
	#Maximum distance in blocks at which Boss Respawner blocks are outlined.
	#Default: 32
	# Default: 32
	# Range: 1 ~ 256
	highlightBossRespawnerRange = 48

[compat]
	#Block IDs that should be treated as other mods' respawn cages/altars.
	#The placement code will avoid placing near these blocks.
	#Example: ["cataclysm:boss_respawner"]
	foreignCageBlockIds = ["cataclysm:boss_respawner"]

[debug]
	#Debug logging. When true, prints debug information about Boss respawner placement and spawning to the log.
	#This setting lives in its own [debug] group.
	debugInfo = false
