[general]
	#Block destruction mode for skills (ON, PARTIAL_PROTECTION, FTB_FORBID, OFF). ON destroys everything without checks. PARTIAL_PROTECTION (partial protection) respects BreakEvent-based protections (fdbosses/WorldGuard etc.) and does not require FTB. FTB_FORBID also runs the BreakEvent protection check, then forbids destruction in any claimed chunk (requires FTB Chunks).
	#Allowed Values: ON, PARTIAL_PROTECTION, FTB_FORBID, OFF
	blockDestructionMode = "PARTIAL_PROTECTION"
	#Time manipulation ability mode: OFF (disabled), TICK (tick rate control), TIME (daytime sun control)
	#Allowed Values: OFF, TICK, TIME
	timeAbilityMode = "TIME"
	#Max blocks actually destroyed per tick by chunked block destruction (supernova, star laser). Higher values finish faster but can cause lag spikes.
	# Default: 2048
	# Range: 64 ~ 32768
	blockDestructionBlocksPerTick = 2048
	#Whether block destruction skills (supernova, star laser) drop ores. Default false to reduce item entity lag.
	blockDestructionOreDrops = false

[skills]
	#Black Hole block destruction override: GLOBAL (follow blockDestructionMode), ON (always enabled), PARTIAL_PROTECTION (partial protection: BreakEvent-based, no FTB needed), FTB_FORBID (FTB-only: run BreakEvent protection check, then forbid in claimed chunks), OFF (disabled)
	#Allowed Values: GLOBAL, ON, PARTIAL_PROTECTION, FTB_FORBID, OFF
	blackHoleBlockDestruction = "GLOBAL"
	#Supernova Explosion block destruction override: GLOBAL (follow blockDestructionMode), ON (always enabled), PARTIAL_PROTECTION (partial protection: BreakEvent-based, no FTB needed), FTB_FORBID (FTB-only: run BreakEvent protection check, then forbid in claimed chunks), OFF (disabled)
	#Allowed Values: GLOBAL, ON, PARTIAL_PROTECTION, FTB_FORBID, OFF
	supernovaBlockDestruction = "GLOBAL"
	#True Gravity Field block destruction override: GLOBAL (follow blockDestructionMode), ON (always enabled), PARTIAL_PROTECTION (partial protection: BreakEvent-based, no FTB needed), FTB_FORBID (FTB-only: run BreakEvent protection check, then forbid in claimed chunks), OFF (disabled)
	#Allowed Values: GLOBAL, ON, PARTIAL_PROTECTION, FTB_FORBID, OFF
	trueGravityFieldBlockDestruction = "GLOBAL"
	#Stellar Laser block destruction override: GLOBAL (follow blockDestructionMode), ON (always enabled), PARTIAL_PROTECTION (partial protection: BreakEvent-based, no FTB needed), FTB_FORBID (FTB-only: run BreakEvent protection check, then forbid in claimed chunks), OFF (disabled)
	#Allowed Values: GLOBAL, ON, PARTIAL_PROTECTION, FTB_FORBID, OFF
	starLaserBlockDestruction = "GLOBAL"

[starlight]
	#Weather factor when raining
	# Default: 0.7
	# Range: 0.0 ~ 1.0
	weatherRainFactor = 0.7
	#Weather factor when thundering
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	weatherThunderFactor = 0.5
	#Sky-open factor when sky is blocked (underground)
	# Default: 0.6
	# Range: 0.0 ~ 1.0
	skyBlockedFactor = 0.6
	#Star cubes scan radius (blocks)
	# Default: 6
	# Range: 1 ~ 32
	cubesRange = 6
	#Star power bonus per nearby star cube block
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	cubesBonusPer = 0.05
	#Maximum star power bonus from cubes. 1.0 means no effective cap (star power itself is still capped at 100%).
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	cubesBonusMax = 0.5
