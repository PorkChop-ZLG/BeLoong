[general]
	#Block destruction mode for skills (ON, FTB_PROTECTION, FTB_FORBID, OFF). FTB_PROTECTION checks per-block permission; FTB_FORBID forbids destruction in any claimed chunk.
	#Allowed Values: ON, FTB_PROTECTION, FTB_FORBID, OFF
	blockDestructionMode = "FTB_PROTECTION"
	#Time manipulation ability mode: OFF (disabled), TICK (tick rate control), TIME (daytime sun control)
	#Allowed Values: OFF, TICK, TIME
	timeAbilityMode = "TIME"
	#Max blocks actually destroyed per tick by chunked block destruction (supernova, star laser). Higher values finish faster but can cause lag spikes.
	# Default: 2048
	# Range: 64 ~ 32768
	blockDestructionBlocksPerTick = 2048
	#Whether block destruction skills (supernova, star laser) drop ores. Default false to reduce item entity lag.
	blockDestructionOreDrops = false

[skills]
	#Base damage for Black Hole skill
	# Default: 6.0
	# Range: 1.0 ~ 20.0
	blackHoleBaseDamage = 6.0
	#Black Hole block destruction override: GLOBAL (follow blockDestructionMode), ON (always enabled), FTB_PROTECTION (per-claim permission), FTB_FORBID (forbid in claims), OFF (disabled)
	#Allowed Values: GLOBAL, ON, FTB_PROTECTION, FTB_FORBID, OFF
	blackHoleBlockDestruction = "GLOBAL"
	#Supernova Explosion block destruction override: GLOBAL (follow blockDestructionMode), ON (always enabled), FTB_PROTECTION (per-claim permission), FTB_FORBID (forbid in claims), OFF (disabled)
	#Allowed Values: GLOBAL, ON, FTB_PROTECTION, FTB_FORBID, OFF
	supernovaBlockDestruction = "GLOBAL"
	#True Gravity Field block destruction override: GLOBAL (follow blockDestructionMode), ON (always enabled), FTB_PROTECTION (per-claim permission), FTB_FORBID (forbid in claims), OFF (disabled)
	#Allowed Values: GLOBAL, ON, FTB_PROTECTION, FTB_FORBID, OFF
	trueGravityFieldBlockDestruction = "GLOBAL"
	#Stellar Laser block destruction override: GLOBAL (follow blockDestructionMode), ON (always enabled), FTB_PROTECTION (per-claim permission), FTB_FORBID (forbid in claims), OFF (disabled)
	#Allowed Values: GLOBAL, ON, FTB_PROTECTION, FTB_FORBID, OFF
	starLaserBlockDestruction = "GLOBAL"

[starlight]
	#Minimum day-night factor at noon (0.0 ~ 1.0)
	# Default: 0.3
	# Range: 0.0 ~ 1.0
	dayNightMin = 0.3
	#Weather factor when raining
	# Default: 0.7
	# Range: 0.0 ~ 1.0
	weatherRainFactor = 0.7
	#Weather factor when thundering
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	weatherThunderFactor = 0.5
	#Sky-open factor when sky is blocked (underground)
	# Default: 0.6
	# Range: 0.0 ~ 1.0
	skyBlockedFactor = 0.6
	#Minimum damage modifier when bar is at 0%
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	minDamageModifier = 0.1
	#Star cubes scan radius (blocks)
	# Default: 6
	# Range: 1 ~ 32
	cubesRange = 6
	#Star power bonus per nearby star cube block
	# Default: 0.05
	# Range: 0.0 ~ 1.0
	cubesBonusPer = 0.05
	#Maximum star power bonus from cubes
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	cubesBonusMax = 0.5
