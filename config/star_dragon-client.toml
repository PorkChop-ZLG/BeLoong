[performance]
	#Star Laser visual quality. HIGH = full effects, MEDIUM = no spirals/shockwaves/pulses, LOW = core beam only.
	#Allowed Values: HIGH, MEDIUM, LOW
	laserQuality = "HIGH"
	#Black Hole visual quality. HIGH = lensing + disk + sucked blocks, MEDIUM = no accretion disk, LOW = event horizon only.
	#Allowed Values: HIGH, MEDIUM, LOW
	blackHoleQuality = "HIGH"
	#Meteor Shower visual quality. Controls client-side meteor/target rendering density, not server meteor count.
	#Allowed Values: HIGH, MEDIUM, LOW
	meteorQuality = "HIGH"
	#Supernova visual quality. Reduces client-side particle rendering; server damage and particle count are unchanged.
	#Allowed Values: HIGH, MEDIUM, LOW
	supernovaQuality = "HIGH"
	#Star Cube sparkle quality. Controls the star sparkles rendered on star cube block entities.
	#Allowed Values: HIGH, MEDIUM, LOW
	starCubeQuality = "HIGH"
	#Entity particle quality (Cancer domain / Gemini phantom). Reduces client-side particle spawn rates.
	#Allowed Values: HIGH, MEDIUM, LOW
	entityParticleQuality = "HIGH"
	#Casting starfield screen overlay for star dragons: blue edge gradient + twinkling drifting stars + constellation lines while channeling an ability.
	castingStarfieldOverlay = true
	#Stellar Breath (dragon breath) particle quality. Reduces client-side particle size and lifetime; the server-side particle count is unchanged.
	#Allowed Values: HIGH, MEDIUM, LOW
	stellarBreathQuality = "HIGH"
	#Stellar Breath constellation links: connect nearby core stars inside the breath with faint glowing lines.
	stellarBreathLink = true
